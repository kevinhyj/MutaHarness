<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MutaHarness · 实验结果查看</title>
    <link rel="stylesheet" href="viewer.css" />
    <script src="data.js" defer></script>
    <script src="viewer.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="top">
          <h1>MutaHarness · 实验结果</h1>
          <a href="https://github.com/kevinhyj/MutaHarness"
            >GitHub / 作业说明 ↗</a
          >
        </div>
        <p>
          查看两项独立实验的存档分数、逐任务对照与已有候选排名。Spearman表示预测排序与实验排序的一致程度，越高越好。
        </p>
      </header>
      <div class="tabs" aria-label="选择实验">
        <button id="zero" aria-pressed="true">Structure + MSA · 零样本</button>
        <button id="ensemble" aria-pressed="false">
          Scientific Program Ensemble · 少样本
        </button>
      </div>
      <p class="scope" id="scope"></p>
      <section aria-label="总体均值">
        <h2>全部10个任务的平均 Spearman</h2>
        <div id="means" class="metrics"></div>
        <p class="summary-note" id="summary-note"></p>
      </section>
      <section class="selection" aria-label="当前任务结果">
        <div class="select-top">
          <h2 id="case-title" aria-live="polite"></h2>
          <div>
            <label for="case-select">选择任务 </label
            ><select id="case-select"></select>
          </div>
        </div>
        <p class="current-meta" id="current-meta"></p>
        <div id="case-scores" class="metrics"></div>
        <p class="delta" id="case-delta"></p>
      </section>
      <div class="grid">
        <section class="panel">
          <div class="panel-header">
            <h2>全部任务对照</h2>
            <p>每行最高分加粗；点击任务查看详细结果。</p>
          </div>
          <div class="table-scroll">
            <table>
              <thead id="tablehead"></thead>
              <tbody id="tablebody"></tbody>
              <tfoot id="tablefoot"></tfoot>
            </table>
          </div>
          <p class="caption" id="table-caption"></p>
        </section>
        <section
          class="panel detail"
          id="detail"
          aria-label="当前任务的证据与候选"
        >
          <h2 id="detail-title"></h2>
          <div class="source-links">
            <a id="source-link">本任务的存档指标 ↗</a>
          </div>
          <div id="explanation"></div>
        </section>
      </div>
      <footer>
        <p>
          两个实验分别保留选中的任务。两项改进的反馈量和候选不同，提升不能相加。本页仅展示已有结果，没有进行新模型调用或新湿实验。
        </p>
        <a
          href="https://github.com/kevinhyj/MutaHarness/blob/main/docs/results.md"
          >完整结果、失败记录与成本说明 ↗</a
        >
      </footer>
    </main>
    <template id="zero-detail">
      <p>
        四组使用同一批250个候选。基础Codex可以使用科学工具并写程序；另外三组分别增加MSA、结构或联合证据与分析工具。
      </p>
      <p>
        结构帮助判断空间环境，MSA帮助判断自然变化；两者如何影响分数，取决于实验测的是哪种性质。
      </p>
      <div class="source-links">
        <a
          href="https://github.com/kevinhyj/MutaHarness/blob/main/tools/msa_tools.py"
          >MSA工具 ↗</a
        >
        <a
          href="https://github.com/kevinhyj/MutaHarness/blob/main/tools/structure_tools.py"
          >结构工具 ↗</a
        >
      </div>
      <p>
        这里同时改变了原始输入、预处理和工具，因此不能将整体收益归于某一个特征，也不证明模型直接理解三维坐标。
      </p>
    </template>
    <template id="ensemble-detail">
      <p>
        三份程序从相同的96条反馈中学习。反馈交叉验证选择的是<strong
          data-cv-program
        ></strong
        >；单次Codex对应预先固定的程序1。测试标签没有参与选择或融合权重。
      </p>
      <div class="source-links" data-program-links></div>
      <div class="candidate">
        <h3>集成排名的前10个候选</h3>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>突变</th>
                <th>排名分</th>
                <th>分歧</th>
              </tr>
            </thead>
            <tbody data-candidates></tbody>
          </table>
        </div>
      </div>
      <p>
        排名分来自三份已有预测的等权排名融合，范围−1至1，用于排序，<strong>不是上方的Spearman或成功概率</strong>。分歧是三程序排名百分位的标准差，数值越大表示意见越不一致。
      </p>
    </template>
  </body>
</html>
