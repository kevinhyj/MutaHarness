[tool.ruff]
target-version = "py311"
line-length = 100
include = ["demo.py", "runtime/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/plot_results.py" = ["E402"]
"scripts/plot_evagent_results.py" = ["E402"]
